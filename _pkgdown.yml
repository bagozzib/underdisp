url: https://bagozzib.github.io/underdisp/

template:
  bootstrap: 5
  bslib:
    primary: "#2C3E50"

home:
  title: "underdisp: Diagnostics and Models for Underdispersed Count Data"
  description: >
    Detect and model underdispersion in count data: a zero-truncated-Poisson
    at-risk screen, regression-adjusted dispersion tests and profiles, the
    continuous parameter binomial and generalized event count families with
    high-dimensional fixed effects, matched Poisson, negative binomial,
    COM-Poisson, generalized Poisson, gamma-count and double Poisson
    regressions, hurdle and zero-inflated forms, proper scores, and one set
    of quantities of interest for every model.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/underdisp.html
    articles:
      text: Articles
      menu:
        - text: Getting started with underdisp
          href: articles/underdisp.html

